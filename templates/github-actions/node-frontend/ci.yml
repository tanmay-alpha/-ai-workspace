name: Node Frontend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  node-frontend-checks:
    name: Node frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Detect frontend directory
        id: detect
        shell: bash
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "frontend/package.json" ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
          elif [ -f "client/package.json" ]; then
            echo "dir=client" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if no package.json exists
        if: steps.detect.outputs.dir == ''
        shell: bash
        run: |
          echo "No package.json found. This template is for Node/React/Next/Vite projects."
          exit 0

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Run lint if available
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script found. Skipping lint."
          fi

      - name: Run tests if available
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        run: |
          if npm run | grep -q " test"; then
            npm test -- --watch=false
          else
            echo "No test script found. Skipping tests."
          fi

      - name: Build if available
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script found. Skipping build."
          fi
